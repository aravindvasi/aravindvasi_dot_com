<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Aravind V. A.</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <script>
    (function(){
      var t = localStorage.getItem('theme') ||
              (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      position: relative;
      z-index: 2;
      padding: 2rem;
      text-align: center;
    }

    #pendulum-svg {
      width: 280px;
      height: 260px;
      max-width: 80vw;
    }

    .error-code {
      display: block;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .error-title {
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.03em;
      font-variation-settings: 'opsz' 144;
      margin-bottom: 1rem;
    }

    .error-msg {
      font-family: var(--mono);
      font-size: 0.88rem;
      color: var(--ink-dim);
      margin-bottom: 2.5rem;
      max-width: 38ch;
    }

    .error-back {
      font-family: var(--mono);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--bg);
      background: var(--accent);
      padding: 0.75rem 1.75rem;
      display: inline-block;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .error-back:hover {
      background: var(--ink);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="bg-grid"   aria-hidden="true"></div>
  <div class="bg-grain"  aria-hidden="true"></div>
  <div class="bg-aurora" aria-hidden="true"></div>

  <div class="error-page">
    <svg id="pendulum-svg" viewBox="0 0 320 290" xmlns="http://www.w3.org/2000/svg"></svg>

    <div>
      <span class="error-code">Error 404</span>
      <h1 class="error-title">Page not found.</h1>
      <p class="error-msg">This page doesn't exist — or maybe it's still swinging.</p>
      <a href="/" class="error-back">← Back to home</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const SWING_MS   = 820;
      const CONTACT_MS = 90;
      const MAX_ANGLE  = Math.PI / 4;
      const STRING_LEN = 114;
      const PIVOT_Y    = 54;
      const BALL_R     = 12;
      const BALL_X     = [112, 136, 160, 184, 208];
      const CYCLE      = SWING_MS * 4 + CONTACT_MS * 2;

      const svg = document.getElementById('pendulum-svg');
      const NS  = 'http://www.w3.org/2000/svg';

      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      const C_BALL   = cssVar('--accent')    || '#c4ff3e';
      const C_STRING = cssVar('--ink-faint') || '#4a4a52';
      const C_FRAME  = cssVar('--ink-dim')   || '#9a9aa0';

      function el(tag, attrs) {
        const node = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        return node;
      }

      svg.appendChild(el('ellipse', { cx: 160, cy: 222, rx: 65, ry: 5, fill: 'rgba(0,0,0,0.25)' }));
      svg.appendChild(el('rect', { x: 30, y: 38, width: 260, height: 8, rx: 2, fill: C_FRAME }));

      BALL_X.forEach(px => {
        svg.appendChild(el('circle', { cx: px, cy: PIVOT_Y, r: 2.5, fill: C_FRAME }));
      });

      const strings = BALL_X.map(px => {
        const line = el('line', {
          x1: px, y1: PIVOT_Y,
          x2: px, y2: PIVOT_Y + STRING_LEN,
          stroke: C_STRING, 'stroke-width': 1
        });
        svg.appendChild(line);
        return line;
      });

      const balls = BALL_X.map(px => {
        const circle = el('circle', {
          cx: px, cy: PIVOT_Y + STRING_LEN,
          r: BALL_R, fill: C_BALL
        });
        svg.appendChild(circle);
        return circle;
      });

      function setPos(idx, angle) {
        const px = BALL_X[idx];
        const bx = px + STRING_LEN * Math.sin(angle);
        const by = PIVOT_Y + STRING_LEN * Math.cos(angle);
        balls[idx].setAttribute('cx', bx);
        balls[idx].setAttribute('cy', by);
        strings[idx].setAttribute('x2', bx);
        strings[idx].setAttribute('y2', by);
      }

      function easeIn(t)  { return Math.cos(t * Math.PI / 2); }
      function easeOut(t) { return Math.sin(t * Math.PI / 2); }

      const P1 = SWING_MS;
      const P2 = SWING_MS + CONTACT_MS;
      const P3 = 2 * SWING_MS + CONTACT_MS;
      const P4 = 3 * SWING_MS + CONTACT_MS;
      const P5 = 3 * SWING_MS + 2 * CONTACT_MS;

      function getState(elapsed) {
        const t = elapsed % CYCLE;
        if      (t < P1) return { a1: -MAX_ANGLE * easeIn(t / SWING_MS),           a5: 0 };
        else if (t < P2) return { a1: 0,                                             a5: 0 };
        else if (t < P3) return { a1: 0, a5:  MAX_ANGLE * easeOut((t - P2) / SWING_MS) };
        else if (t < P4) return { a1: 0, a5:  MAX_ANGLE * easeIn((t - P3) / SWING_MS)  };
        else if (t < P5) return { a1: 0,                                             a5: 0 };
        else             return { a1: -MAX_ANGLE * easeOut((t - P5) / SWING_MS),    a5: 0 };
      }

      setPos(0, -MAX_ANGLE);

      let start = null;
      function tick(ts) {
        if (!start) start = ts;
        const { a1, a5 } = getState(ts - start);
        setPos(0, a1);
        setPos(4, a5);
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
